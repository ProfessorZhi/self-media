name: Guokao supplemental graduate codebooks
on:
  push:
    branches: ['data/guokao-gap-closure-20261017']
    paths: ['.github/workflows/guokao-data-snapshot.yml']
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public PDF sources and record retrieval integrity
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, ssl, urllib.request
          out=pathlib.Path('graduate-inputs');out.mkdir()
          sources={
            'graduate_admission_2024.pdf':'https://ass.xjass.cn/static/ewebeditor/uploadfile/2026081917214659773.pdf',
            'graduate_admission_2018.pdf':'https://ass.xjass.cn/static/ewebeditor/uploadfile/2026081917220891321.pdf',
            'graduate_admission_yn.pdf':'https://hrss.yn.gov.cn/Uploads/NewsPhoto/2024-09-06/0452f6a8-9cbd-439c-bf44-aae1123348cd.pdf'
          }
          def get(item):
            name,url=item; tls=True
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try: response=urllib.request.urlopen(req,timeout=30)
              except urllib.error.URLError as e:
                if 'CERTIFICATE_VERIFY_FAILED' not in str(e) or not url.startswith('https://ass.xjass.cn/'):raise
                tls=False
                response=urllib.request.urlopen(req,timeout=30,context=ssl._create_unverified_context())
              with response as r: data=r.read();final=r.url;ctype=r.headers.get('Content-Type')
              if not data.startswith(b'%PDF-'):raise ValueError('Not a PDF')
              (out/name).write_bytes(data)
              return {'file':name,'url':url,'final_url':final,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'tls_certificate_verified':tls,'ok':True}
            except Exception as e:return {'file':name,'url':url,'ok':False,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:results=list(pool.map(get,sources.items()))
          (out/'manifest.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: guokao-graduate-codebook-inputs
          path: graduate-inputs/
          retention-days: 7
          if-no-files-found: error
