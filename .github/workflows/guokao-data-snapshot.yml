name: Guokao vocational catalog input
on:
  push:
    branches: ['data/guokao-gap-closure-20261017']
    paths: ['.github/workflows/guokao-data-snapshot.yml']
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve the published vocational directory
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          p=pathlib.Path('vocational-input');p.mkdir()
          url='http://www.moe.gov.cn/s78/A07/zcs_ztzl/2017_zt06/17zt06_bznr/zhijiao/202607/P020260714589584937536.docx'
          r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40)
          data=r.read()
          assert data.startswith(b'PK'), 'Expected a DOCX ZIP'
          (p/'vocational-2026-07.docx').write_bytes(data)
          manifest={'url':url,'final_url':r.url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'retrieval_date':'2026-10-17','transport':'HTTP public official attachment'}
          (p/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: guokao-vocational-catalog-input
          path: vocational-input/
          retention-days: 7
          if-no-files-found: error
